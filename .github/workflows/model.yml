name: NBA model (odds + data + scoring)

# Started by the 7:59am morning scan. Pulls the full-slate odds (unless
# pull_odds=false), refreshes game logs and injuries, then scores every prop.
on:
  workflow_dispatch:
    inputs:
      pull_odds:
        description: "Pull fresh odds first (uses Odds API credits)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull odds
        if: ${{ github.event.inputs.pull_odds != 'false' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py
      - name: Update game logs (last 4 days)
        run: python build_gamelogs.py --recent 4
      - name: Injuries
        run: python fetch_injuries.py || echo "injury pull failed - model runs without it"
      - name: Score the slate
        run: python model.py
      - name: Commit
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Model slate $(date -u +%F)"
          git pull --rebase && git push
