name: NBA odds pull

on:
  # No timer: GitHub's cron ran 3-4 hours late. The 8am morning scan and
  # the 9:35am pre-tip check start this themselves (or run it by hand from
  # the Actions tab).
  workflow_dispatch:
    inputs:
      games:
        description: "Optional: only these teams, comma-separated (e.g. Knicks,Lakers). Blank = full slate"
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AU player props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GAMES: ${{ github.event.inputs.games }}
        run: python fetch_odds.py
      - name: Commit odds
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds/
          git diff --cached --quiet || git commit -m "Odds $(date -u +%F)"
          git pull --rebase && git push
