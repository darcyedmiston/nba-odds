name: NBA odds pull

on:
  schedule:
    - cron: "45 17 * * *"   # 4:45am Melbourne backup only - GitHub cron runs hours late; the morning scan triggers this itself
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: repo-commits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AU player props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py
      - name: Commit odds
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds/
          git diff --cached --quiet || git commit -m "Odds $(date -u +%F)"
          git pull --rebase && git push
