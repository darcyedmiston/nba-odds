name: Rebuild a season of game logs

# Temporary branch-only version: runs the one-off historical coverage test.
on:
  workflow_dispatch:
    inputs:
      season:
        default: "n/a"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python hist_coverage.py
