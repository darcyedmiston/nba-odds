name: NBA game-log backfill

# Branch-only version for the one-off historical odds pull. Not for merging as is.
on:
  workflow_dispatch:
    inputs:
      limit:
        default: "0"

permissions:
  contents: write

concurrency:
  group: hist-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          python -u hist_backfill.py --limit ${{ github.event.inputs.limit }}
